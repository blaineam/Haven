name: Haven
options:
  bundleIdPrefix: com.blaineam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # In-app localization: English develops; the shipped locale set is exactly
  # ja/de/es/ko/pt-BR/it (loc-glossary.json excludes fr-FR and zh-Hans —
  # export compliance, not preference).
  developmentLanguage: en

packages:
  # Shared feedback / rating / "other apps" kit (Libraries/MillerKit).
  MillerKit:
    url: https://github.com/blaineam/MillerKit
    from: "1.1.0"
  # Prebuilt WebRTC binary (libwebrtc) for reliable E2EE audio/video calls. Signaling rides
  # Haven's own sealed channel; media is DTLS-SRTP peer-to-peer.
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "120.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "8ZVSPZYSVF"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    # Emit localizable strings from bare SwiftUI Text("…")/Label("…") literals so
    # `xcodebuild -exportLocalizations` sees them and Localizable.xcstrings can
    # serve the ja/de/es/ko/pt-BR/it translations at runtime.
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  # iOS/iPadOS app. macOS now ships from the native `HavenMac` target (Mac Catalyst dropped
  # 2026-06-23 — see docs/MACOS-NATIVE-PORT.md Phase 4).
  Haven:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: HavenApp
        excludes:
          - "Info*.plist"
          # Compiled separately with -suppress-warnings (legacy AVFoundation sync accessors).
          - HavenAVComposition.swift
          # Finder "Foo 2.swift" duplicates (copy conflicts) — never compile.
          - "* 2.swift"
          - "* 2.entitlements"
      - path: HavenApp/HavenAVComposition.swift
        compilerFlags: ["-suppress-warnings"]
      - path: Shared
      # FFI-free Codable models shared with the HavenWatch companion (WCSession wire types).
      - path: WatchShared
      - path: Generated/haven_ffi.swift
    dependencies:
      - package: MillerKit
      - framework: HavenFFI.xcframework
        embed: false
      # iroh's network-discovery deps (netdev, hickory DNS, system_configuration)
      # reference SCDynamicStore* — link SystemConfiguration.
      - sdk: SystemConfiguration.framework
      # Embed the Apple Watch companion app (thin WCSession client — no HavenFFI/WebRTC).
      - target: HavenWatch
        embed: true
      # Embed the Notification Service Extension so blind push payloads decrypt on-device.
      - target: HavenNotificationService
      # ReplayKit broadcast upload extension (iOS screen sharing in calls). App Group
      # group.com.blaineam.kith pipes screen frames to the app.
      - target: HavenBroadcast
        platformFilter: iOS
      # Share Extension: accept text/links/photos/videos from other apps → DM / post / story.
      # App ID com.blaineam.kith.ShareExtension must carry the App Groups capability (group.com.blaineam.kith).
      - target: HavenShareExtension
        platformFilter: iOS
      # WebRTC for E2EE audio/video calls (media is P2P DTLS-SRTP; signaling over our channel).
      - package: WebRTC
    info:
      path: HavenApp/Info.plist
      properties:
        CFBundleDisplayName: Haven
        # Track the build settings (a managed Info.plist won't do this automatically).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # The relay's plain-HTTP media interface on the LAN (http://<lan-ip>:8674) — blobs are
        # E2E-sealed before they touch the wire; public URLs should be https (proxy/tunnel).
        # Lives HERE because xcodegen regenerates Info.plist from these properties: a hand-edit
        # to the plist (commit 1177c8d) silently vanished on every `xcodegen generate`.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Required for the donated INSendMessageIntent interactions that put Haven conversations in
        # the share sheet's suggestion row (ShareSuggestions.swift). Without this declaration the
        # donations are accepted but the system never draws a tile for them.
        NSUserActivityTypes:
          - INSendMessageIntent
        UILaunchScreen: {}
        # Required by the Mac App Store (ignored on iOS). Haven is a social network.
        LSApplicationCategoryType: public.app-category.social-networking
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Haven uses the camera so you can capture photos and videos to share with your circle. Nothing is uploaded — media is encrypted on your device first."
        NSMicrophoneUsageDescription: "Haven uses the microphone to record sound with your videos."
        NSPhotoLibraryUsageDescription: "Haven lets you pick photos and videos from your library to share privately with your circle."
        NSPhotoLibraryAddUsageDescription: "Haven can save photos and videos you share or receive to your Photos library, so they're ready when you open Photos."
        NSAppleMusicUsageDescription: "Haven lets you add a song to a post; it plays through your own Apple Music."
        NSLocalNetworkUsageDescription: "Haven finds people in your circle who are nearby so it can share posts directly over Wi-Fi and Bluetooth — even with no internet."
        NSBluetoothAlwaysUsageDescription: "Haven uses Bluetooth to share posts directly with nearby people in your circle when you're offline."
        NSLocationWhenInUseUsageDescription: "Haven uses your location only when you choose to pin and share a spot on a map with your circle. It's never tracked or uploaded otherwise."
        NSFaceIDUsageDescription: "Haven uses Face ID to unlock circles you've chosen to lock, so only you can open them."
        NSBonjourServices:
          - _haven-circle._tcp
          - _haven-circle._udp
        # EAR-exempt (standard mass-market crypto, not shipped to France) → NO. The app
        # still has full E2E post-quantum encryption; this is only the US export answer.
        ITSAppUsesNonExemptEncryption: false
        # Invite deep links: haven://u/<id>#<verify>.
        CFBundleURLTypes:
          - CFBundleURLName: com.blaineam.kith
            CFBundleURLSchemes: [haven]
        # Local notifications only — no push server. A background-refresh wake briefly
        # brings up P2P networking, syncs, and posts LOCAL notifications for anything new.
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
          - voip
        BGTaskSchedulerPermittedIdentifiers:
          - com.blaineam.kith.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blaineam.kith
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "464"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # macOS ships from the native HavenMac target — don't ALSO offer this iOS app on Mac
        # ("Designed for iPad"), which would clash with HavenMac's bundle id on App Store Connect.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        # Device/QA-loop (Debug) builds get a sandbox APNs token; archives ship production.
        # Matches PushManager.isSandbox (#if DEBUG) and the dev vs distribution profiles.
        Debug:
          CODE_SIGN_ENTITLEMENTS: HavenApp/Haven.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: HavenApp/Haven.entitlements

  # Native macOS (AppKit-backed SwiftUI) app — THE macOS build (Mac Catalyst dropped 2026-06-23).
  # Shares the exact same HavenApp / Shared / Generated sources; the platform differences live
  # behind `#if os(macOS)` and the shims in Platform.swift. No NSE/Broadcast app-extensions here
  # (those are iOS-only; macOS notifications/screen-share use the in-process desktop paths).
  # Some platform views (camera/in-call video/Apple Music/screen share) are placeholders pending
  # the Phase-2 native-view backfill — see docs/MACOS-NATIVE-PORT.md.
  HavenMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HavenApp
        excludes:
          - "Info*.plist"
          - HavenAVComposition.swift
          - "* 2.swift"
          - "* 2.entitlements"
      - path: HavenApp/HavenAVComposition.swift
        compilerFlags: ["-suppress-warnings"]
      - path: Shared
      - path: Generated/haven_ffi.swift
    dependencies:
      - package: MillerKit
      - framework: HavenFFI.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - package: WebRTC
    info:
      path: HavenApp/Info.macOS.plist
      properties:
        CFBundleDisplayName: Haven
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # LAN plain-HTTP relay media (see the iOS target's note — xcodegen owns this plist).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.social-networking
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Haven uses the camera so you can capture photos and videos to share with your circle. Nothing is uploaded — media is encrypted on your device first."
        NSMicrophoneUsageDescription: "Haven uses the microphone to record sound with your videos."
        NSPhotoLibraryUsageDescription: "Haven lets you pick photos and videos from your library to share privately with your circle."
        NSPhotoLibraryAddUsageDescription: "Haven can save photos and videos you share or receive to your Photos library, so they're ready when you open Photos."
        NSAppleMusicUsageDescription: "Haven lets you add a song to a post; it plays through your own Apple Music."
        NSLocalNetworkUsageDescription: "Haven finds people in your circle who are nearby so it can share posts directly over Wi-Fi and Bluetooth — even with no internet."
        NSBluetoothAlwaysUsageDescription: "Haven uses Bluetooth to share posts directly with nearby people in your circle when you're offline."
        NSLocationWhenInUseUsageDescription: "Haven uses your location only when you choose to pin and share a spot on a map with your circle. It's never tracked or uploaded otherwise."
        NSFaceIDUsageDescription: "Haven uses Touch ID to unlock circles you've chosen to lock, so only you can open them."
        NSBonjourServices:
          - _haven-circle._tcp
          - _haven-circle._udp
        CFBundleURLTypes:
          - CFBundleURLName: com.blaineam.kith
            CFBundleURLSchemes: [haven]
    # Cloudflare Quick Tunnel helper → Contents/Helpers/cloudflared, signed with this build's
    # identity (Xcode Cloud automatic signing sets EXPANDED_CODE_SIGN_IDENTITY). Binary is
    # fetched in apple/ci_scripts/ci_post_clone.sh; not committed. See apple/Helpers/README.md.
    postBuildScripts:
      - path: Scripts/embed-cloudflared.sh
        name: Embed and sign cloudflared
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(SRCROOT)/Helpers/cloudflared
          - $(SRCROOT)/Helpers/cloudflared.entitlements
          - $(SRCROOT)/Scripts/embed-cloudflared.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FULL_PRODUCT_NAME)/Contents/Helpers/cloudflared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blaineam.kith
        PRODUCT_NAME: Haven
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "464"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # OFF so the embed/codesign script can write into the .app and invoke /usr/bin/codesign
        # (user-script sandboxing blocks both). Only this target — iOS keeps sandboxing on.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: HavenApp/Haven.macOS.Debug.entitlements
        Release:
          # Must use the Mac-form push key (com.apple.developer.aps-environment). The iOS
          # short key `aps-environment` is silently stripped against Mac Store profiles.
          CODE_SIGN_ENTITLEMENTS: HavenApp/Haven.macOS.entitlements

  HavenNotificationService:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: HavenNotificationService
      - path: Shared
      - path: Generated/haven_ffi.swift
    dependencies:
      - framework: HavenFFI.xcframework
        embed: false
      # The static Rust core (UniFFI scaffolding references the networking node) pulls in
      # iroh/netdev symbols: SCDynamicStore* (SystemConfiguration) + nw_path_monitor_*
      # (Network). The app gets Network transitively; the bare extension must link it itself.
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
    info:
      path: HavenNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Haven
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blaineam.kith.NotificationService
        PRODUCT_MODULE_NAME: HavenNotificationService
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "464"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: HavenNotificationService/NSE.entitlements
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  # ReplayKit broadcast upload extension: captures the whole screen on iOS and pipes frames to the
  # app through the shared App Group. iOS-only.
  HavenBroadcast:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: HavenBroadcast
      - path: Shared/BroadcastIPC.swift
    info:
      path: HavenBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Haven
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blaineam.kith.Broadcast
        PRODUCT_MODULE_NAME: HavenBroadcast
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "464"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: HavenBroadcast/Broadcast.entitlements
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

  # Share Extension: appears in the iOS share sheet for text/links/photos/videos. It drops the
  # shared items into the App Group inbox and opens haven://share; the app routes to DM/post/story.
  HavenShareExtension:
    type: app-extension
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: HavenShareExtension
      - path: Shared/ShareInbox.swift
      # The destination snapshot the composer draws its picker from (written by the app).
      - path: Shared/SharedDestinations.swift
    info:
      path: HavenShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Haven
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # THIS is what puts Haven's conversations in the share sheet's suggestion row. Donating
            # INSendMessageIntent (ShareSuggestions.swift) only tells the system the conversations
            # exist; without an extension that declares it can RECEIVE that intent, iOS has nothing
            # to hand a tapped suggestion to, so it draws no tile. Donations alone are silent — they
            # don't warn, they just never show up.
            IntentsSupported:
              - INSendMessageIntent
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              # Documents: PDFs, zips, .docx, anything the source app vends as a file. Both keys —
              # `File` covers items shared as file URLs (Files.app), `Attachments` covers the ones
              # vended as generic data (Mail, Notes).
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blaineam.kith.ShareExtension
        PRODUCT_MODULE_NAME: HavenShareExtension
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.4.3"
        CURRENT_PROJECT_VERSION: "464"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: HavenShareExtension/Share.entitlements
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  # Pure-logic unit tests. Deliberately host-LESS and FFI-less: the only app source it compiles is
  # MediaUploadPlan.swift, so `xcodebuild test -scheme HavenLogicTests -destination 'platform=macOS'`
  # runs on the host Mac in seconds with no simulator, no signed host app, and no HavenFFI. The rule
  # it covers (when a chunked upload may skip a window it did not write) is the one whose failure
  # mode is a permanently corrupt, content-addressed blob — it needs a test that runs cheaply enough
  # that people actually run it. Add pure-logic files here as they appear.
  HavenLogicTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HavenApp/MediaUploadPlan.swift
      - path: HavenApp/RelayAddress.swift
      - path: HavenApp/MediaVariants.swift
      - path: HavenApp/FileArchive.swift
      - path: HavenApp/PushBanner.swift
      # HavenFabricTests covers the Haven-first ICE policy + hairpin URL derivation. Foundation/os
      # only, so the target stays host-LESS. CallHairpin is deliberately NOT here: it grew a
      # FeedStore/RelayMailboxStore dependency in its reconnect path, which broke this target's
      # build entirely (silently — nothing runs this scheme in CI). The pure URL derivation moved to
      # HavenFabric.swift as HavenHairpin; the socket code stays in the app where its deps live.
      - path: HavenApp/HavenFabric.swift
      - path: HavenApp/HavenLog.swift
      - path: Shared/SharedNotificationPrivacy.swift
      - path: HavenLogicTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blaineam.kith.logictests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  HavenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HavenUITests
    dependencies:
      - target: Haven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blaineam.kith.uitests
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TEST_TARGET_NAME: Haven

  # Standalone Apple Watch companion (single-target SwiftUI watchOS app — no separate WatchKit
  # extension; `WKApplication` in Info.plist). Thin client: talks to the iPhone over WCSession,
  # holds NO iroh node and links NEITHER HavenFFI NOR WebRTC. Embedded in the iOS Haven app.
  HavenWatch:
    type: application
    dependencies:
      - package: MillerKit
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: HavenWatch
      # FFI-free Codable wire models shared with the iPhone app.
      - path: WatchShared
    info:
      path: HavenWatch/Info.plist
      properties:
        CFBundleDisplayName: Haven
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.blaineam.kith
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blaineam.kith.watchkitapp
        # Distinct product (bundle) name so the embedded watch app never collides with the
        # iOS app's Haven.app; the user-facing name is still "Haven" via CFBundleDisplayName.
        PRODUCT_NAME: HavenWatch
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.4.3"
        # Keep in lock-step with the host iOS app's build number (Apple requires an embedded
        # watch app to share the companion's version/build).
        CURRENT_PROJECT_VERSION: "464"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # The AppIcon set carries BOTH a watchos and an ios image entry on purpose: the required
        # CI command builds the iOS app with `-sdk iphonesimulator`, which forces this embedded
        # target to compile against the iOS SDK too, and actool errors if no icon is applicable
        # to the active SDK (Info.plist sets CFBundleIconName).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Haven:
    build:
      targets:
        Haven: all
        HavenUITests: [test]
    test:
      targets:
        - HavenUITests
  HavenLogicTests:
    build:
      targets:
        HavenLogicTests: [test]
    test:
      targets:
        - HavenLogicTests
  HavenMac:
    build:
      targets:
        HavenMac: all
  HavenWatch:
    build:
      targets:
        HavenWatch: all

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haven</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/qrcode.js" defer></script>
    <script src="vendor/jsQR.js" defer></script>
    <script src="app.js" type="module" defer></script>
  </head>
  <body>
    <!-- The title bar IS the navigation, exactly like the macOS build: the Circle/Messages/You
         segmented pill centred, and a per-tab trailing slot on the right (circle switcher +
         manage-circle on Circle; the settings gear on You). It draws no background of its own — the
         body's brand gradient runs underneath it.
         The traffic lights below are macOS-ONLY (CSS gates them on `data-os`): Windows and Linux run
         decorated and get their OS's own titlebar above this bar. -->
    <div class="titlebar" data-tauri-drag-region>
      <div class="traffic">
        <button class="tl close" id="win-close" aria-label="Close window"></button>
        <button class="tl min" id="win-min" aria-label="Minimize window"></button>
        <button class="tl max" id="win-max" aria-label="Zoom window"></button>
      </div>

      <nav class="tabs glass" id="tabs" role="tablist" aria-label="Haven">
        <button class="tab active" data-view="circle" role="tab">Circle<i class="badge" id="badge-circle"></i></button>
        <button class="tab" data-view="messages" role="tab">Messages<i class="badge" id="badge-messages"></i></button>
        <button class="tab" data-view="you" role="tab">You</button>
      </nav>

      <!-- Activity bell — the in-app notification list. Rides beside the per-tab trailing slot
           (the tabs pill is absolutely centred, so this is the flow position "next to the tabs");
           app.js fills the glyph, wires the panel, and drives the unread badge. -->
      <button class="icon-btn glass" id="bell-btn" title="Activity" aria-label="Activity"
              style="margin-left:auto;position:relative"><i class="badge" id="badge-bell"
              style="position:absolute;top:-4px;right:-6px;margin-left:0"></i></button>

      <!-- Per-tab trailing controls, rendered by app.js (macOS toolbar `.havenTrailing`). -->
      <div class="tb-right" id="tb-right" style="margin-left:0"></div>
    </div>

    <main class="content">
      <section id="view-circle" class="view active"></section>
      <section id="view-messages" class="view"></section>
      <section id="view-you" class="view"></section>
      <!-- The floating composer lives OUTSIDE the scrolling view on purpose: as a child of
           `.view` (which is the scroll container) an absolutely-positioned bar is placed against
           the scrolled padding box, so it scrolled away with the feed instead of floating over
           it. Here it's a sibling pinned to `.content`, and the feed genuinely passes underneath. -->
      <div id="composer-slot"></div>
    </main>

    <div id="toast" class="toast"></div>
    <div id="modal-root"></div>
    <div id="menu-root"></div>
  </body>
</html>

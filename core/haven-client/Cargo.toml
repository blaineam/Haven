[package]
name = "haven-client"
version = "0.0.1"
edition = "2021"
publish = false
description = "The Haven client layer shared by the desktop app and the browser build: app wire protocol, sync, media and relay policy, and the engine that drives them"

[features]
# Test helpers (`covtest_util`) for the crates that host the engine — a throwaway data dir and an
# engine on it. Never enabled in a shipped build.
test-util = []

# Builds for every target, wasm32 included: the app wire protocol and the pure policy modules.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The engine and its stores. Native-only for now: they still reach the filesystem, the OS keyring,
# tokio and the native node directly. They move behind the `rt`/`host` seams (and a storage seam)
# module by module until this table is empty — see docs/WEB-PARITY.md.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Non-poisoning mutexes. See the StdMutex alias in engine.rs for why.
parking_lot = "0.12"
haven_ffi = { path = "../haven-ffi" }
haven-p2p = { path = "../haven-p2p" }
haven-s3 = { path = "../haven-s3" }
haven-net = { path = "../haven-net" }
# The 512px AVIF preview tier (docs/PREVIEW-TIER-DESIGN.md). asm OFF (pure-Rust rav1e) on every
# target: the assembly cannot assemble under the MSVC arm64 cross toolchain.
ravif = { version = "0.11", default-features = false, features = ["threading"] }
rgb = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hkdf = "0.12"
rand = "0.8"
hex = "0.4"
data-encoding = "2"
dirs = "5"
base64 = "0.22"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

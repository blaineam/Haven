name: Play car-app probe

# Haven's templated Android Auto screens (Calls / Messages) are a Google BETA. Play accepts them on internal and
# closed testing and refuses them on open testing / production, and nobody announces when that changes — so once a
# week this asks Play itself. It builds a bundle that DECLARES the car app, opens a Play edit, puts the bundle on a
# draft production release and runs edits.validate; the edit is always deleted, nothing is committed.
#
#   Play refuses  → the run is green and says so in the summary (nothing to do; checked again next week).
#   Play accepts  → dispatches android.yml as a PRODUCTION release with car_app=true, and opens an issue asking
#                   you to set the repo variable PLAY_CAR_APP_ALLOWED=true so later tagged releases keep the screens
#                   (a workflow cannot set variables with the default token).
#   The probe broke (auth, network, build) → the run goes red; that says nothing about Play's policy.
#
# Release rule: this ships whatever is on main as a production release of the CURRENT version, so it will not fire
# while main's version is already live on Play with the car screens off unless Play really accepted the bundle.
# Set the repo variable PLAY_CAR_APP_PROBE=off to stop the weekly check (e.g. after the screens have shipped).

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: android-play-publish   # same group as android.yml: Play allows one open edit per package
  cancel-in-progress: false

jobs:
  probe:
    if: vars.PLAY_CAR_APP_PROBE != 'off' && vars.PLAY_CAR_APP_ALLOWED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Install NDK + platform + build-tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo install cargo-ndk --locked
      - name: Build Rust core
        env: { ABIS: "arm64-v8a armeabi-v7a x86_64 x86" }
        run: ./android/build-rust.sh
      - name: Decode release keystore
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::no ANDROID_KEYSTORE_BASE64 — cannot build a Play-signed bundle"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/haven-release.keystore"
      - name: Build a release bundle that declares the car app
        working-directory: android
        env:
          HAVEN_KEYSTORE_FILE: ${{ runner.temp }}/haven-release.keystore
          HAVEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAVEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HAVEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          HAVEN_FCM_PROJECT_ID: ${{ secrets.HAVEN_FCM_PROJECT_ID }}
          HAVEN_FCM_APP_ID: ${{ secrets.HAVEN_FCM_APP_ID }}
          HAVEN_FCM_API_KEY: ${{ secrets.HAVEN_FCM_API_KEY }}
          HAVEN_FCM_SENDER_ID: ${{ secrets.HAVEN_FCM_SENDER_ID }}
          HAVEN_CAR_APP: "true"
        run: |
          VN="$(grep -m1 -E 'MARKETING_VERSION:' ../apple/project.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          ./gradlew bundleRelease -PhavenVersionCode=${{ github.run_number }} -PhavenVersionName="$VN"
          mkdir -p ../out && find app/build/outputs/bundle -name '*.aab' -exec cp {} ../out/probe.aab \;
      - name: Ask Play whether it accepts the car app on production
        id: probe
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth requests
          set +e
          python3 Scripts/play-car-app-probe.py out/probe.aab com.blaineam.haven "${{ github.run_number }}" | tee probe.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { echo "### Play car-app probe"; echo; echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = "0" ] || [ "$rc" = "3" ]   # 3 = Play said no: a normal answer, not a failure
      - name: Play accepted — release to production with the car screens
        if: steps.probe.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android.yml --ref "${{ github.event.repository.default_branch }}" \
            -f play_track=production -f car_app=true
          gh issue create --title "Play now accepts the Android Auto car screens in production" \
            --body "The weekly probe's production draft passed Play validation with the car app declared, so android.yml was dispatched as a production release with car_app=true.

          To keep the screens in every later tagged release, set the repository variable PLAY_CAR_APP_ALLOWED=true (Settings → Secrets and variables → Actions → Variables). That also stops this weekly probe. Probe run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

name: ms-store-cli-probe

# READ-ONLY check of Microsoft's msstore CLI against Haven's Store listing: does `submission status` / `get` /
# `getListingAssets` work for this packaged app now (the legacy submission-CREATE path broke in 2026-08)? Changes nothing.
# Windows runner: the CLI stores its credentials in the OS credential manager (libsecret on Linux needs a keyring).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    env:
      STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
      STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
      STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
      STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
      STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
    steps:
      - name: Install msstore CLI
        shell: pwsh
        run: |
          $v = "v0.4.3"
          Invoke-WebRequest "https://github.com/microsoft/msstore-cli/releases/download/$v/MSStoreCLI-win-x64.zip" -OutFile msstore.zip
          Invoke-WebRequest "https://github.com/microsoft/msstore-cli/releases/download/$v/MSStoreCLI-win-x64.zip.sha256.txt" -OutFile msstore.sha
          $want = ([regex]::Match((Get-Content msstore.sha -Raw), '[0-9a-fA-F]{64}')).Value
          $got = (Get-FileHash msstore.zip -Algorithm SHA256).Hash
          if ($want -ne $got) { throw "checksum mismatch: $want vs $got" }
          Expand-Archive msstore.zip -DestinationPath bin
          "$PWD\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & .\bin\msstore.exe --version
      - name: Configure
        shell: pwsh
        run: msstore reconfigure -v --tenantId $env:STORE_TENANT_ID --clientId $env:STORE_CLIENT_ID --clientSecret $env:STORE_CLIENT_SECRET --sellerId $env:STORE_SELLER_ID
      - name: Read-only submission commands
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($c in "status","get","getListingAssets") {
            Write-Host "::group::msstore submission $c"
            msstore submission $c $env:STORE_APP_ID 2>&1 | Select-Object -First 80
            Write-Host "exit=$LASTEXITCODE"
            Write-Host "::endgroup::"
          }

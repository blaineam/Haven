name: android

# Build the Android APK so beta-testers always have a fresh sideloadable link.
#
# The app (android/) depends on the Rust core (`haven_ffi`) cross-compiled to a per-ABI
# .so via android/build-rust.sh (cargo-ndk) plus generated UniFFI Kotlin bindings. We build
# all four ABIs so the universal APK runs on every device + emulator.
#
# SIGNING: if the ANDROID_KEYSTORE_* secrets are present we decode the keystore and produce a
# release-signed APK; otherwise we fall back to a DEBUG-signed APK so betas build with ZERO setup.
# (android/app/build.gradle.kts `release {}` has no signingConfig, so an unsigned assembleRelease
# can't be installed — the debug fallback is what makes a no-secrets beta sideloadable.)
#
# Triggers: push to main (always-fresh link), workflow_dispatch, and `v*` tags.
#
# ── CHANNEL POLICY ─────────────────────────────────────────────────────────────────────────
# Android is a *paid Google Play app*; its proper channel is Play, not a GitHub Release. We
# always BUILD the APK/AAB (CI compile check + the Play-publish step consume them) and always
# keep the APK as a CI artifact — the policy is only about what gets ATTACHED to the public
# GitHub Release. Because the Play listing is not public yet (the AAB currently lands on the
# INTERNAL track), removing Android from GH now would leave Android users no install path. So
# the two "Attach … to the GitHub Release" steps below are gated on a repo variable that
# defaults to ON:
#
#     PUBLISH_ANDROID_TO_GH   unset/anything ≠ "false"  → APK + AAB ride the Release (stopgap)
#                             "false"                    → Android comes off GH (set this the day
#                                                          the Google Play listing goes public)
#
# Set it at repo → Settings ▸ Secrets and variables ▸ Actions ▸ Variables. Rationale + the exact
# trigger are in docs/RELEASING.md ("Release channels"). (Windows' equivalent toggle,
# PUBLISH_WINDOWS_TO_GH, lives in release.yml.)

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Compile-only verification before a change can reach main. The Play steps are all gated on
  # `steps.play.outputs.submit`, which is only computed for tags and workflow_dispatch, so a PR
  # run builds and publishes NOTHING. Added because Android has no local build on every machine
  # that edits it (a Mac without a JDK can edit Kotlin it cannot compile), and "it builds" was
  # being asserted from a grep exit code rather than a compiler.
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      # ── Manual Play-track override (see docs/STORE-AUTOPUBLISH.md "Promoting to production").
      # A `v*` tag NEVER reads these — the TAG decides its channel: `-rc.N` goes to testers,
      # a plain tag goes to production. This is for the off-schedule case: re-uploading the current
      # version to a different track, or a staged rollout. The DEFAULT is `internal`, so a manual
      # run you forget to configure can't publish anything publicly.
      play_track:
        description: "Google Play track to publish to (manual override; tags decide their own)"
        required: false
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      play_rollout:
        description: "Staged-rollout fraction 0.0-1.0 for a partial release (blank/1.0 = full). Only for alpha/beta/production."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Does this push actually touch Android? A main push that only edits apple/, web/ or docs/ has no
  # business rebuilding the Rust core for four ABIs.
  #
  # This is a JOB-level gate rather than an `on.push.paths:` filter on purpose: `paths` would also
  # be evaluated for TAG pushes, and a tag can point at a commit whose diff touches nothing here —
  # which would silently skip the release build and the Play upload. Tags always build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'core/**'
              - '.github/workflows/android.yml'

  build:
    needs: changes
    if: github.ref_type == 'tag' || needs.changes.outputs.android == 'true'
    # ── One Play publish at a time ──────────────────────────────────────────────────────────────
    # Google Play allows ONE open Edit per package. Two publish-capable runs racing (a `v*` tag
    # push → internal, plus a workflow_dispatch play_track=beta on the same ref) each open their
    # own Edit; the slower one commits into "This edit has expired, please create a new Edit" and
    # the AAB never lands (observed on v1.1.4-rc.23 beta, run 30019665798 — and because the publish
    # step is continue-on-error; the "Flag a Play publish that did not land" step is what turns that
    # into a failed run).
    # So: serialize publish-capable runs (tag pushes + all workflow_dispatch) in one static group —
    # the second run QUEUES instead of racing. Plain main pushes never publish, so each gets a
    # unique throwaway group (run_id) and keeps running fully parallel.
    # Caveat: GitHub keeps only the NEWEST pending run per group; if a third publish run piles on,
    # the middle one is cancelled — visibly (red "cancelled"), never a silent green no-op.
    concurrency:
      group: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'android-play-publish' || format('android-build-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + platform + build-tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core (.so per ABI) + UniFFI Kotlin bindings
        env:
          ABIS: "arm64-v8a armeabi-v7a x86_64 x86"
        run: ./android/build-rust.sh

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/haven-release.keystore"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — building a DEBUG-signed beta APK."
          fi

      # ── Resolve the Play target (version name + track + rollout) ──────────────────────────────
      # PROMOTION POLICY — THE TAG DECIDES THE CHANNEL. `vX.Y.Z-rc.N` is a release candidate and
      # goes to testers only; `vX.Y.Z` is a release and goes live. Precedence:
      # dispatch input > PLAY_TRACK variable > the tag's own channel.
      #   • rc tag    `v1.3.0-rc.1`  → internal AND alpha (testers), NEVER production
      #   • plain tag `v1.3.0`       → production
      #   • workflow_dispatch play_track=alpha   → alpha  (CLOSED testing — this is the closed track)
      #   • workflow_dispatch play_track=beta     → beta   (OPEN testing — public opt-in link)
      #
      # `alpha` is Play's CLOSED track and `beta` is its OPEN one — the reverse of how the words are
      # usually used, and this comment had them backwards. Publishing a "closed test" to `beta`
      # targets a track that was never configured, and the Publishing API answers
      # `Precondition check failed` — which reads like a broken credential rather than the wrong
      # destination. Closed testers live on ALPHA.
      #   • workflow_dispatch play_track=production (+ play_rollout)  → staged/full production
      #   • PLAY_TRACK set                        → pins EVERY tag to that track, overriding the
      #                                             tag's own channel (except the rc guard, which
      #                                             nothing overrides). Unset it to go back to
      #                                             "the tag decides".
      # A rollout fraction < 1.0 switches the release to status=inProgress (Play staged rollout);
      # blank or 1.0 means a fully-live release (status=completed). See docs/STORE-AUTOPUBLISH.md.
      - name: Resolve Play version + track
        id: cfg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          IN_TRACK: ${{ github.event.inputs.play_track }}
          IN_ROLLOUT: ${{ github.event.inputs.play_rollout }}
          VAR_TRACK: ${{ vars.PLAY_TRACK }}
          VAR_ROLLOUT: ${{ vars.PLAY_USER_FRACTION }}
        run: |
          set -euo pipefail
          # versionName: a tag carries it ("v1.0.5" → "1.0.5"); a manual run has no tag, so fall
          # back to the single source of truth (apple/project.yml MARKETING_VERSION, same value the
          # release.yml meta-gate enforces) rather than stamp the branch name.
          if [ "$REF_TYPE" = "tag" ]; then
            VN="${REF_NAME#v}"
          else
            VN="$(grep -m1 -E 'MARKETING_VERSION:' apple/project.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          # Is this a release CANDIDATE? `vX.Y.Z-rc.N` is the only pre-release shape release.yml
          # accepts, and it is the whole basis of the channel split below.
          case "$REF_NAME" in
            *-rc.*) IS_RC=1 ;;
            *)      IS_RC=0 ;;
          esac
          # track: dispatch input > repo variable > THE TAG'S OWN CHANNEL.
          #
          #   rc tag      → internal   (testers try it first; nothing public sees it)
          #   plain tag   → production (an ordinary release ships)
          #
          # The default used to be `internal` for everything, which made shipping a finished release
          # a second, manual act somebody had to remember. The tag already says which kind of build
          # this is — `-rc.N` or not — so it may as well be the thing that decides.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${IN_TRACK:-}" ]; then
            TRACK="$IN_TRACK"
          elif [ -n "${VAR_TRACK:-}" ]; then
            TRACK="$VAR_TRACK"
          elif [ "$IS_RC" = "1" ]; then
            TRACK="internal"
          else
            TRACK="production"
          fi
          # rc GUARD: an rc may ship to a PRE-RELEASE track, but must NEVER reach Play PRODUCTION —
          # not via PLAY_TRACK, not via a dispatch input, not via the default above. This is the one
          # rule in here that overrides an explicit human choice, deliberately: asking for
          # production while tagging an rc is a contradiction, and the safe reading is "internal".
          # Beta/alpha are downgraded too — an rc goes to OUR testers, not to an open opt-in track.
          if [ "$IS_RC" = "1" ] && [ "$TRACK" != "internal" ]; then
            echo "::notice::rc tag $REF_NAME → Play track $TRACK→internal (an rc never publishes past internal testers)."
            TRACK="internal"
          fi
          # rollout fraction: dispatch input > repo variable > none
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${IN_ROLLOUT:-}" ]; then
            FRAC="$IN_ROLLOUT"
          else
            FRAC="${VAR_ROLLOUT:-}"
          fi
          # A partial fraction ⇒ staged rollout (inProgress); blank/1.0 ⇒ fully live (completed).
          if [ -n "$FRAC" ] && [ "$FRAC" != "1" ] && [ "$FRAC" != "1.0" ]; then
            STATUS="inProgress"; USERFRACTION="$FRAC"
          else
            STATUS="completed"; USERFRACTION=""
          fi
          # COMPANION TRACK: a PRE-RELEASE goes to internal AND closed testing, not one or the
          # other. `internal` is the fast lane for our own devices; `alpha` is Play's CLOSED track,
          # where the actual testers are. Shipping to only one meant testers either got nothing or
          # had to be served by a second, manual dispatch — and two runs racing the same versionCode
          # is exactly how v1.1.4-rc.23's AAB failed to land (run 30019665798). Doing both in ONE
          # run, sequentially, removes that race.
          #
          # `production` has no companion (the case below only pairs internal⇄alpha), which is what
          # an ordinary release wants: it goes live, and the testing tracks are already carrying the
          # rc it was promoted from.
          #
          # An EXPLICIT dispatch choice stays single-track: asking for production means production,
          # not production plus a surprise. Same for an explicit PLAY_TRACK variable.
          EXTRA=""
          if [ "$EVENT" != "workflow_dispatch" ] || [ -z "${IN_TRACK:-}" ]; then
            if [ -z "${VAR_TRACK:-}" ]; then
              case "$TRACK" in
                internal) EXTRA="alpha" ;;
                alpha)    EXTRA="internal" ;;
              esac
            fi
          fi
          {
            echo "version_name=$VN"
            echo "track=$TRACK"
            echo "extra_track=$EXTRA"
            echo "status=$STATUS"
            echo "user_fraction=$USERFRACTION"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Play target → track=$TRACK${EXTRA:+ (+$EXTRA)} status=$STATUS userFraction=${USERFRACTION:-<none>} version=$VN"

      - name: Build signed release APK
        if: steps.keystore.outputs.have_keystore == 'true'
        working-directory: android
        env:
          HAVEN_KEYSTORE_FILE: ${{ runner.temp }}/haven-release.keystore
          HAVEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAVEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HAVEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build debug APK (beta fallback, no secrets)
        if: steps.keystore.outputs.have_keystore == 'false'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      # The APK is now the PRIVATE download channel for the Android GUI (Play Store is the public
      # one). Keep only recent builds — short retention so it never becomes a long artifact history.
      - uses: actions/upload-artifact@v4
        with:
          name: haven-android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7

      # CHANNEL POLICY (see file header): the APK only rides the GitHub Release as a stopgap
      # until the Google Play listing is public. Flip PUBLISH_ANDROID_TO_GH=false to take it off.
      # UNSET is the safe default so Android users aren't stranded before Play goes live.
      # rc GUARD: a `-rc.N` tag builds the APK (kept as a CI artifact above) but must NOT create/attach
      # to a public GitHub Release — only clean vX.Y.Z tags do. See docs/QA.md.
      # rc tags included: their release is a PRE-RELEASE under the rc tag (see release.yml), so an
      # APK attached there can't be mistaken for the stable download, and a candidate nobody can
      # sideload is a candidate nobody tests.
      - name: Attach APKs to the GitHub Release (on v* tags, until Play is public)
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ANDROID_TO_GH != 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          fail_on_unmatched_files: true
          # This workflow races release.yml, and whichever arrives first CREATES the release — so
          # both must agree on these or an rc could land as a normal "Latest" release.
          prerelease: ${{ contains(github.ref, '-rc') }}
          make_latest: ${{ !contains(github.ref, '-rc') }}

      # ── Google Play: build a signed AAB on tags + publish to the internal track ──────────────
      # Needs the release keystore (ANDROID_KEYSTORE_* — same one Play App Signing was enrolled
      # with) AND a Play Developer API service-account JSON (PLAY_SERVICE_ACCOUNT_JSON). Both are
      # gates: missing either just skips the upload, so betas keep building untouched.
      # FIRST RELEASE CAVEAT: Google requires the very first AAB of a new app to be uploaded by
      # hand in the Play Console (to enroll App Signing). After that, this job takes over.
      # Built on `v*` tags AND on manual workflow_dispatch (so a deliberate track promotion can
      # rebuild + re-upload the same version to production). versionName comes from steps.cfg.
      - name: Build signed release AAB (for Play)
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.keystore.outputs.have_keystore == 'true'
        working-directory: android
        env:
          HAVEN_KEYSTORE_FILE: ${{ runner.temp }}/haven-release.keystore
          HAVEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAVEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HAVEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VN: ${{ steps.cfg.outputs.version_name }}
        run: |
          ./gradlew bundleRelease -PhavenVersionCode=${{ github.run_number }} -PhavenVersionName="$VN"
          mkdir -p ../out
          find app/build/outputs/bundle -name '*.aab' -exec cp {} ../out/ \;
          ls -la ../out

      # KEEP THE AAB. It used to be built, handed to the Play API, and thrown away — so when the API
      # refused it (a Console-side gate like an undeclared permission), the only artifact that could
      # get past that gate by hand did not exist anywhere. Rebuilding it locally is not an option
      # either: it must be signed with the upload key, which lives in CI secrets. That is a
      # chicken-and-egg the retained bundle breaks.
      - name: Keep the signed AAB (manual Console upload when the API refuses)
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && steps.keystore.outputs.have_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: haven-android-aab
          path: out/*.aab
          if-no-files-found: error
          retention-days: 7

      # CHANNEL POLICY (see file header): the AAB rides the Release only as a stopgap so it's
      # downloadable for a manual Play upload while the listing isn't automated/public yet. Once
      # Play is public + auto-publishing, set PUBLISH_ANDROID_TO_GH=false to keep it off GH.
      # rc GUARD (see above): rc AABs stay CI-artifact-only + go to the internal Play track for QA.
      - name: Attach AAB to the GitHub Release (stopgap for manual Play upload, until Play is public)
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.have_keystore == 'true' && vars.PUBLISH_ANDROID_TO_GH != 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.aab
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref, '-rc') }}
          make_latest: ${{ !contains(github.ref, '-rc') }}

      - name: Check Play credentials
        id: play
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ] && [ "${{ steps.keystore.outputs.have_keystore }}" = "true" ]; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
          else
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON (or no release keystore) — skipping Play upload."
          fi

      # r0adkll/upload-google-play uploads the AAB + release notes ("what's new") only — it has NO
      # inputs for title/description/graphics (verified against its action.yml). So we hand it the
      # release notes via whatsNewDirectory and let `fastlane supply` (below) push the rest of the
      # listing. whatsNewDirectory wants files named `whatsnew-<locale>`; build one from the fastlane
      # changelog (a versionCode-specific changelogs/<code>.txt wins over changelogs/default.txt).
      # Google caps this at 500 chars/locale, so default.txt is kept under that.
      - name: Prepare Play what's-new (from the fastlane changelog)
        if: steps.play.outputs.submit == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/whatsnew"
          mkdir -p "$dir"
          base="android/fastlane/metadata/android/en-US/changelogs"
          src="$base/${{ github.run_number }}.txt"
          [ -f "$src" ] || src="$base/default.txt"
          cp "$src" "$dir/whatsnew-en-US"
          # Google hard-rejects the whole edit if any locale's notes exceed 500 CHARACTERS
          # (not bytes — a "•" is 3 bytes). A silent over-run here once shipped a broken 1.0.6
          # (release notes 501 chars → commit refused, and the publish step is continue-on-error,
          # so the run went green with nothing published). Truncate defensively so length can
          # never fail the commit, and warn loudly so we notice and trim the source.
          chars=$(wc -m < "$dir/whatsnew-en-US")
          if [ "$chars" -gt 500 ]; then
            echo "::warning::Play what's-new is $chars chars (>500); truncating. Trim $src."
            head -c 4000 "$dir/whatsnew-en-US" | cut -c1-497 > "$dir/whatsnew-en-US.trim"
            printf '%s…' "$(cat "$dir/whatsnew-en-US.trim")" > "$dir/whatsnew-en-US"
            rm -f "$dir/whatsnew-en-US.trim"
          fi
          echo "whatsnew<<EOF" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      # ── Upload the AAB + assign it to the resolved track (staged rollout when set) ────────────
      - name: Publish AAB to Google Play (${{ steps.cfg.outputs.track }} track)
        id: playpublish
        if: steps.play.outputs.submit == 'true'
        # Non-fatal: the APK + AAB are already published to the GitHub Release above. A Play-side gate
        # (e.g. the one-time "advertising ID" App Content declaration not yet set) shouldn't red-X the
        # whole release — surface it, but let the release stand.
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.blaineam.haven
          releaseFiles: out/*.aab
          releaseName: ${{ steps.cfg.outputs.version_name }}
          track: ${{ steps.cfg.outputs.track }}
          status: ${{ steps.cfg.outputs.status }}
          # Empty string is falsy to the action, so a non-staged release simply omits it.
          userFraction: ${{ steps.cfg.outputs.user_fraction }}
          whatsNewDirectory: ${{ env.whatsnew }}

      # ── The companion track (internal ⇄ alpha) ───────────────────────────────────────────────
      # PROMOTE the release we just made — do NOT upload the AAB a second time. The previous version
      # of this step re-uploaded the same file on the belief that "Play recognises a versionCode it
      # already holds and assigns it to the new track". It does not: the first upload consumes the
      # versionCode, and the second is rejected with "Version code NNN has already been used." The
      # dual-track publish therefore never once worked — v1.1.5 predated the step, so v1.1.6 was the
      # first tag to exercise it, and it failed silently (see the guard below).
      #
      # `supply --track_promote_to` assigns the EXISTING release to the second track, which is what
      # the comment always claimed was happening. Nothing is uploaded, so there is no code to collide.
      #
      # Still non-fatal: the first track has already landed by this point, so a failure here costs the
      # companion track, never the release.
      - name: Promote to the ${{ steps.cfg.outputs.extra_track }} track
        id: playpromote
        if: steps.play.outputs.submit == 'true' && steps.cfg.outputs.extra_track != ''
        continue-on-error: true
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FROM_TRACK: ${{ steps.cfg.outputs.track }}
          TO_TRACK: ${{ steps.cfg.outputs.extra_track }}
          VERSION_CODE: ${{ github.run_number }}
          STATUS: ${{ steps.cfg.outputs.status }}
        run: |
          set -euo pipefail
          command -v fastlane >/dev/null || sudo gem install fastlane --no-document
          fastlane supply \
            --json_key_data "$SUPPLY_JSON_KEY_DATA" \
            --package_name com.blaineam.haven \
            --track "$FROM_TRACK" \
            --track_promote_to "$TO_TRACK" \
            --version_code "$VERSION_CODE" \
            --release_status "$STATUS" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs true \
            --changes_not_sent_for_review false

      # `continue-on-error` above deliberately keeps a Play-side gate from red-X'ing the release — but a
      # failure there was also INVISIBLE in the job list. A release-notes overflow (Play caps them at 500
      # chars) silently rolled the whole edit back, so nothing reached Play while the step still read as
      # green. Keep the policy, but say so loudly.
      - name: Flag a Play publish that did not land
        if: steps.play.outputs.submit == 'true' && (steps.playpublish.outcome == 'failure' || steps.playpromote.outcome == 'failure')
        run: |
          # FAIL, don't warn. These steps are continue-on-error so a Play hiccup can't block the
          # GitHub Release — but the run reporting SUCCESS while the AAB never reached Play is how
          # Android silently stays on the previous build with a green tick next to it. The artifacts
          # are already published by the time this runs, so failing here costs nothing and is the
          # only signal that the thing the tag was cut FOR did not happen.
          failed=0
          if [ "${{ steps.playpublish.outcome }}" = "failure" ]; then
            echo "::error title=Play publish did not land::The AAB was NOT published to ${{ steps.cfg.outputs.track }}. Check the publish step's log — a common cause is release notes over Play's 500-character limit, which rolls the edit back."
            failed=1
          fi
          if [ "${{ steps.playpromote.outcome }}" = "failure" ]; then
            echo "::error title=Companion track did not land::The release reached ${{ steps.cfg.outputs.track }} but was NOT promoted to ${{ steps.cfg.outputs.extra_track }}, so closed testers are still on the previous build. Promote it in the Console or re-run this step."
            failed=1
          fi
          exit $failed

      # ── Sync the FULL store listing (title, short/long description, feature graphic, screenshots)
      #    from android/fastlane/metadata via `fastlane supply`. r0adkll can't do this; supply reads
      #    the exact fastlane layout the repo already has. Binaries + changelogs are skipped here
      #    (the AAB + what's-new were handled above), so this edit only touches listing text/images.
      #    Non-fatal: a listing hiccup must never fail the release. Listing metadata is app-global in
      #    Play (not per-track), so the track passed is only for supply's edit context.
      - name: Sync Play store listing (text + images) via fastlane supply
        if: steps.play.outputs.submit == 'true'
        continue-on-error: true
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ steps.cfg.outputs.track }}
        run: |
          set -euo pipefail
          sudo gem install fastlane --no-document
          fastlane supply \
            --json_key_data "$SUPPLY_JSON_KEY_DATA" \
            --package_name com.blaineam.haven \
            --track "$TRACK" \
            --metadata_path android/fastlane/metadata/android \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_changelogs true \
            --changes_not_sent_for_review false

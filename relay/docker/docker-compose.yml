# Haven relay on your NAS (or any always-on box) via Docker Compose.
#
#   1. Copy this folder (Dockerfile, entrypoint.sh, this file) to your NAS.
#   2. In the Haven app, get your circle's relay LINK:
#        Settings ▸ Storage ▸ Advanced → "Connect an external relay"
#        → "Copy this circle's relay link"   (a haven-relay://circle#… link)
#   3. Put that link in a `.env` file next to this one:
#          HAVEN_RELAY_LINK=haven-relay://circle#…
#   4. Bring it up:
#          docker compose up -d --build
#   5. Give the app the relay's NODE ID (so your circle adopts it):
#          docker compose exec haven-relay haven-relay id
#      then paste that 64-hex id back on the same "Connect an external relay" screen
#      (or Relays ▸ Add relay ▸ Haven relay). `docker compose logs -f` shows it too.
#
# The link is saved in the `haven-relay-data` volume, so it survives restarts and updates —
# keep that volume to stay the SAME relay for your circle. The relay only ever moves
# CIPHERTEXT; it holds no key that can read your circle's content.
services:
  haven-relay:
    build:
      context: .
      # Pin a specific release instead of the newest:
      #   args: { HAVEN_RELAY_VERSION: v1.1.3 }
      #
      # Or build from SOURCE at a branch/tag/sha — for trying a relay fix without waiting on a
      # release. It fetches the source itself, so nothing but this folder needs to be on the NAS:
      #   args: { HAVEN_RELAY_SOURCE: 1, HAVEN_RELAY_REF: main }
      # (equivalently: docker compose build --build-arg HAVEN_RELAY_SOURCE=1 --build-arg HAVEN_RELAY_REF=main)
      # Expect a long first build — it compiles the whole net stack.
      args:
        HAVEN_RELAY_SOURCE: ${HAVEN_RELAY_SOURCE:-0}
        HAVEN_RELAY_REF: ${HAVEN_RELAY_REF:-main}
    image: haven-relay:local
    container_name: haven-relay
    restart: unless-stopped
    environment:
      # FIRST run only. Once a link is saved in /data this value is IGNORED (the entrypoint says so
      # in the log). It used to be re-applied on every start, which silently reverted a relay you
      # had re-linked by hand the next time the container restarted.
      HAVEN_RELAY_LINK: ${HAVEN_RELAY_LINK:-}
      # Set to 1 for ONE start to deliberately overwrite the saved link with HAVEN_RELAY_LINK
      # (e.g. pairing this relay with a different account). Leave unset otherwise.
      HAVEN_RELAY_LINK_FORCE: ${HAVEN_RELAY_LINK_FORCE:-}
      # Optional but RECOMMENDED for a rock-stable node id: pin the identity seed (64 hex chars,
      # `openssl rand -hex 32`). With it set, the relay keeps the SAME node id across restarts and
      # image rebuilds even if the /data volume is lost or recreated — so your circle never has to
      # re-adopt the relay. Without it the id comes from /data/identity.json and lives only as long
      # as that volume. Put HAVEN_RELAY_SEED=… in your .env next to this file.
      HAVEN_RELAY_SEED: ${HAVEN_RELAY_SEED:-}
      # ── SET THIS if anyone reaches this relay over the INTERNET. Media cannot move without it.
      #
      # The HTTP interface is not a nicety — it is the ONLY working media transport across NAT. The
      # iroh blob path drops its datagrams over a pure-relay cross-NAT route, so a blob dial that
      # must cross a NAT stalls ~30s and dies, WHILE MESSAGING KEEPS WORKING. That asymmetry is what
      # the failure looks like from the outside: posts and messages arrive, media never does, and
      # the logs say only "relay put timed out".
      #
      # The relay advertises this interface by enumerating its own addresses, which under Docker
      # bridge networking is the CONTAINER's (172.x.y.z) — unreachable by anyone. A LAN address is
      # no better for a remote member. It must be the address members ACTUALLY use:
      #   HAVEN_RELAY_HTTP_URL=https://relay.example.com        (reverse proxy / tunnel — preferred)
      #   HAVEN_RELAY_HTTP_URL=http://203.0.113.10:8674         (port-forward 8674 to this box)
      #   HAVEN_RELAY_HTTP_URL=http://192.168.1.50:8674         (LAN-only relay, no remote members)
      #
      # Everything it serves is already end-to-end sealed, so plain HTTP exposes ciphertext only —
      # but a proxy with TLS is still the tidier answer if you have one.
      # `network_mode: host` fixes ONLY the container-address half; a remote member still needs a
      # publicly reachable URL here.
      HAVEN_RELAY_HTTP_URL: ${HAVEN_RELAY_HTTP_URL:-}
      # Haven fabric (DERP + TURN). Requires a binary built with fabric support
      # (feature/iroh-relay-gossip or a release that includes it). See docs/NAS-FABRIC-RELAY.md.
      # DERP public HTTPS URL (proxy → container :3340). Optional if LAN-only.
      HAVEN_RELAY_DERP_URL: ${HAVEN_RELAY_DERP_URL:-}
      # TURN public URI(s) and the IP TURN advertises in ALLOCATE. UDP 3478 must reach this box.
      HAVEN_RELAY_TURN_URL: ${HAVEN_RELAY_TURN_URL:-}
      HAVEN_RELAY_TURN_PUBLIC_IP: ${HAVEN_RELAY_TURN_PUBLIC_IP:-}
      # Set to 1 to disable embedded DERP / TURN (n0 + Google STUN remain fallbacks for clients).
      HAVEN_RELAY_NO_DERP: ${HAVEN_RELAY_NO_DERP:-}
      HAVEN_RELAY_NO_TURN: ${HAVEN_RELAY_NO_TURN:-}
    # Alternative to setting HAVEN_RELAY_HTTP_URL: host networking, where the relay sees the
    # box's real LAN addresses and advertises them correctly on its own. Drop `ports:` if you
    # use it (host networking publishes directly). Linux/most NAS only — not Docker Desktop.
    # network_mode: host
    ports:
      - "8674:8674"          # TCP — plain-HTTP media interface
      - "3340:3340"          # TCP — iroh DERP (Haven fabric; proxy TLS terminates in front)
      - "3478:3478/udp"      # UDP — circle TURN (WebRTC ICE; not fronted by trycloudflare)
    volumes:
      - haven-relay-data:/data   # identity + sealed-blob mailbox — keep to stay the same relay
    # The relay dials OUT over Haven Net and needs no inbound port for *messaging* via n0 fallback;
    # publishing 8674/3340/3478 is what makes *your* fabric the primary path.
    #
    # Prefer a bind mount to a specific NAS share? Replace the volume line with, e.g.:
    #   - /volume1/docker/haven-relay:/data
    # and delete the top-level `volumes:` block below.

volumes:
  haven-relay-data:

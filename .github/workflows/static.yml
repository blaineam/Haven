# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    # Only redeploy Pages when the site actually changed. This one is safe to filter at the trigger
    # (no tags involved) — every commit to apple/, android/ or desktop/ was rebuilding and
    # redeploying an identical site.
    paths:
      - "web/**"
      - "docs/**"
      - ".github/workflows/static.yml"
      - ".github/legacy-site.mjs"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # The site lives at wemiller.com/apps/haven/ now: the portfolio's mirror-app-docs
      # workflow rsyncs web/ from this repo (the source, not this deploy), so it always gets
      # the real pages. haven.wemiller.com keeps serving every file, but each mirrored page
      # becomes a redirect to its copy there (path, query and #fragment kept). Left as they are:
      #   - open/ — the deep-link landing page. The apps claim wemiller.com/apps/haven/open, but
      #     any haven.wemiller.com/open/#… link still resolves on this host without a hop.
      #   - .well-known/ and every other non-HTML file.
      - name: Build the redirecting site
        run: |
          set -euo pipefail
          cp -R web _site
          node .github/legacy-site.mjs _site web https://wemiller.com/apps/haven/ \
            --keep open/index.html --keep _preview.html
      # The web client, served from this site at /app/ (docs/WEB-PARITY.md § "From a web site").
      # It is the build of the latest stable Release, never of this commit: the page a person
      # links must be the one that was tested and tagged. A Release from before the site archive
      # existed has none; the site then simply has no /app/ yet. release.yml re-runs this workflow
      # after publishing, so the page follows each release.
      # OFF unless the owner sets the repository variable SITE_WEB_CLIENT=true: serving this page
      # makes the site a place the client's code can be changed from (docs/DECISIONS.md D24).
      - name: Add the web client of the latest release
        if: vars.SITE_WEB_CLIENT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern haven-web-site.tar.gz --dir "$RUNNER_TEMP/webapp" 2>/dev/null; then
            mkdir -p _site/app
            tar -C _site/app -xzf "$RUNNER_TEMP/webapp/haven-web-site.tar.gz"
            test -f _site/app/index.html
            grep -q 'name="haven-host" content="site"' _site/app/index.html
            echo "- web client: $(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName) at /app/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=no web client::the latest release carries no haven-web-site.tar.gz — /app/ is not published"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

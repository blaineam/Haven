[package]
name = "haven-net"
version = "0.0.1"
edition = "2021"
publish = false
description = "Haven networking: iroh-backed P2P transport carrying sealed social envelopes."

[dependencies]
haven-p2p = { path = "../haven-p2p" }
iroh = { version = "1", features = ["unstable-custom-transports"] }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
anyhow = "1"
serde_json = "1.0.150"
data-encoding = "2.11.0"
rand = "0.8"
# Per-request signatures on the HTTP relay transport: the node id IS an ed25519 public key, so
# verifying a request signature is how that transport learns who the caller is (`httprelay`).
ed25519-dalek = "2"
blake3 = "1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

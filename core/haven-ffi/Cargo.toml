[package]
name = "haven_ffi"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "haven_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
haven-net = { version = "0.0.1", path = "../haven-net" }
haven-p2p = { path = "../haven-p2p" }
haven-s3 = { path = "../haven-s3" }
blake3 = "1"
data-encoding = "2.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
uniffi = { version = "0.31.2", features = ["cli", "tokio"] }
# Diagnostic: capture iroh/noq connection-level tracing to a file so a relay dial can be watched
# step-by-step (path selection, DERP fallback, connect, serve). Version pinned to iroh's.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Dev-only: what the harnesses in tests/ need ON TOP of this package's normal dependencies (cargo
# passes those to test targets too). Only crates the shipped lib does not already pull in belong
# here — base64/hex for fixture files, serde_json for the fixture generator. No effect on the
# shipped lib/staticlib/cdylib.
[dev-dependencies]
data-encoding = "2.11.0"
serde_json = "1.0.150"
# NOTE: haven-p2p is deliberately NOT re-declared here. The `enabled_paths` harness does read the
# ratchet index off a live-lane DM wire (haven_p2p::groupkey::EpochEnvelope), but cargo already
# passes every NORMAL dependency of this package to its test targets, and haven-p2p is one (above).
# Declaring it in both tables adds a second graph edge that exists only under `cargo test`, which is
# how `cargo check` and `cargo test` end up resolving the same crate differently. One edge, one
# resolution.

# Android-only: wire the JavaVM + Context into ndk-context so iroh's rustls platform
# verifier can reach the system trust store (otherwise the node panics with
# "android context was not initialized"). No effect on Apple/wasm builds.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

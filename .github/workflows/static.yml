# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    # Only redeploy Pages when the site actually changed. This one is safe to filter at the trigger
    # (no tags involved) — every commit to apple/, android/ or desktop/ was rebuilding and
    # redeploying an identical site.
    paths:
      - "web/**"
      - "docs/**"
      - ".github/workflows/static.yml"
      - ".github/legacy-site.mjs"
      - ".github/web-app-moved.html"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Two jobs, GitHub's own shape for Pages. As one job, the deploy step asked for the artifact
  # within a second of the upload and was told there was none (two runs in a row, 2026-11-25,
  # while the API listed it a moment later).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # The site lives at wemiller.com/apps/haven/ now: the portfolio's mirror-app-docs
      # workflow rsyncs web/ from this repo (the source, not this deploy), so it always gets
      # the real pages. haven.wemiller.com keeps serving every file, but each mirrored page
      # becomes a redirect to its copy there (path, query and #fragment kept). Left as they are:
      #   - open/ — the deep-link landing page. The apps claim wemiller.com/apps/haven/open, but
      #     any haven.wemiller.com/open/#… link still resolves on this host without a hop.
      #   - .well-known/ and every other non-HTML file.
      - name: Build the redirecting site
        run: |
          set -euo pipefail
          cp -R web _site
          node .github/legacy-site.mjs _site web https://wemiller.com/apps/haven/ \
            --keep open/index.html --keep _preview.html
      # The web client lives at wemiller.com/apps/haven/app/ (docs/DECISIONS.md D24): the
      # portfolio's deploy unpacks the newest release there. This address only forwards to it,
      # query and #fragment kept, and drops the service worker an earlier visit may have left.
      - name: Forward /app/ to the web client's address
        run: |
          set -euo pipefail
          mkdir -p _site/app
          cp .github/web-app-moved.html _site/app/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

[package]
name = "haven-web"
version = "0.0.1"
edition = "2021"
publish = false
description = "Browser (wasm32) build of the Haven client core: the sans-IO engine plus a relay-only transport"

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm32-only: on any other target this crate is empty, so `cargo check --workspace`
# and the native test lanes neither build nor link a browser dependency.
[target.'cfg(target_arch = "wasm32")'.dependencies]
haven_ffi = { path = "../haven-ffi" }
haven-p2p = { path = "../haven-p2p" }
haven-client = { path = "../haven-client" }
# Relay-only: a tab cannot bind UDP or accept inbound connections, so every path rides the
# circle relay's WebSocket (DERP) front door. No n0 discovery, no portmapper, no metrics.
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
rand = "0.8"
serde_json = "1"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1"

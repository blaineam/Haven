name: apple-store

# Ship a tagged release to the App Store (iOS + macOS) — the Apple half of "the tag decides".
#
#   vX.Y.Z        → find the Xcode Cloud build of THIS commit (or start one), wait for it,
#                   create the App Store version, set What's New from appstore-metadata*.md,
#                   attach the build, submit for review. Both platforms.
#   vX.Y.Z-rc.N   → nothing. Testers already get every push to main via Xcode Cloud → TestFlight.
#
# Xcode Cloud still does every build (it is the only place Haven's Apple binaries come from);
# this workflow only talks to App Store Connect. It is gated on the ASC API secrets below and
# skips cleanly (green, with a notice) until they exist — so a fresh clone releases Linux/relay/
# Play/Windows as before and simply leaves Apple to the by-hand script.
#
# Secrets (Settings ▸ Secrets and variables ▸ Actions):
#   ASC_API_KEY_ID      the App Store Connect API key id (AuthKey_<id>.p8) — needs App Manager
#   ASC_API_ISSUER_ID   the issuer id
#   ASC_API_KEY_P8      the .p8 file contents (raw PEM or base64)
# Variable (optional):
#   APPLE_STORE_SUBMIT  "false" → attach the build but do NOT press submit (staging a release)
#
# Re-running a failed/cancelled run is safe: every step is idempotent (re-finds the run, the
# version, the attached build; an already-WAITING_FOR_REVIEW version is success).
# See docs/RELEASING.md and docs/STORE-AUTOPUBLISH.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z or X.Y.Z-rc.N (blank when dispatched at a tag ref — the tag carries it)"
        required: false
      commit:
        description: "Full commit sha the release was tagged at (blank = this ref)"
        required: false
      dry_run:
        description: "Read-only: find the Xcode Cloud run + builds, check the notes, write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-store
  cancel-in-progress: false     # a submission in flight must finish; the next tag waits

jobs:
  # The same version gate release.yml runs — the tag must be plain X.Y.Z and match the project.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_rc: ${{ steps.v.outputs.is_rc }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_COMMIT: ${{ github.event.inputs.commit }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          asc="$(python3 - <<'PY'
          import re, pathlib, sys
          t = pathlib.Path("apple/project.yml").read_text()
          vs = set(re.findall(r'(?m)^\s*MARKETING_VERSION:\s*"([^"]+)"', t))
          if not vs: sys.exit("no MARKETING_VERSION found in apple/project.yml")
          if len(vs) > 1: sys.exit(f"apple/project.yml disagrees with itself: MARKETING_VERSION = {sorted(vs)}")
          print(vs.pop())
          PY
          )"
          raw="${INPUT_VERSION:-}"
          if [ -z "$raw" ]; then
            [ "$REF_TYPE" = "tag" ] || { echo "::error::run this from a v* tag, or pass a version"; exit 1; }
            raw="$REF_NAME"
          fi
          version="${raw#v}"
          core="${version%%-rc.*}"
          is_rc=false; [ "$core" != "$version" ] && is_rc=true
          if ! printf '%s' "$core" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$raw' is not X.Y.Z (optionally -rc.N)"; exit 1
          fi
          if [ "$core" != "$asc" ]; then
            echo "::error::Version drift: tag says '$core' but apple/project.yml MARKETING_VERSION says '$asc'."; exit 1
          fi
          # The commit the tag points at — resolve through the tag object so an annotated tag
          # yields the commit, not the tag's own sha.
          commit="${INPUT_COMMIT:-}"
          if [ -z "$commit" ]; then commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"; fi
          echo "version=$core" >> "$GITHUB_OUTPUT"
          echo "is_rc=$is_rc" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$is_rc" = true ]; then
            echo "Haven **$core** — release candidate ($raw): TestFlight-only: the tagged commit gets an Xcode Cloud build found/started and waited to VALID." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Haven **$core** @ \`${commit:0:10}\` — submitting to the App Store." >> "$GITHUB_STEP_SUMMARY"
          fi

  submit:
    needs: meta
    # rc → TestFlight-only: ensure the Xcode Cloud build of the tagged commit exists and reaches
    # VALID (testers have it); no App Store version or review. Full releases submit as before.
    permissions:
      contents: write           # the post-submit step moves main to the next patch version
    runs-on: ubuntu-latest
    timeout-minutes: 240          # Xcode Cloud can take an hour; processing another; review is not waited on
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the script looks at origin/main to know whether main's tip is the tagged commit

      - name: Gate on the ASC API secrets
        id: gate
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$P8" ]; then
            echo "::notice title=apple-store skipped::ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8 are not set — submit by hand: Scripts/asc-new-version.mjs … (docs/RELEASING.md)"
            echo "- ⏭️ Apple: skipped — ASC API secrets not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Submit to the App Store
        if: steps.gate.outputs.ready == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ needs.meta.outputs.commit }}
          IS_RC: ${{ needs.meta.outputs.is_rc }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SUBMIT_FLAG: ${{ vars.APPLE_STORE_SUBMIT }}
        run: |
          set -euo pipefail
          extra=()
          [ "${DRY_RUN:-false}" = "true" ] && extra+=(--dry-run)
          [ "${SUBMIT_FLAG:-true}" = "false" ] && extra+=(--no-submit)
          [ "${IS_RC:-false}" = "true" ] && extra+=(--testflight-only)
          node Scripts/asc-autosubmit.mjs --version "$VERSION" --commit "$COMMIT" --tag "v$VERSION" \
            --platforms IOS,MAC_OS --wait-build 120 --wait-process 45 --notes-dir . "${extra[@]}"

      # Only now — with the tagged commit's Xcode Cloud build attached and submitted — may main
      # move on. Doing this in cut-release (seconds after the tag) made XCC cancel/supersede the
      # release build and left only NEXT-version builds (1.8.3 shipped 1.8.4 builds, twice).
      # Apple closes the released train on approval and XCC builds every main push for
      # TestFlight, so main must not stay at the released version for long either — hence
      # the bump rides on the successful submission. rc tags keep the version (train still open).
      # If the submit step failed, main stays at the released version: fix, re-run this lane, and
      # the bump follows. Runs with GITHUB_TOKEN, so it triggers no other GitHub workflow.
      - name: Move main to the next patch version
        if: steps.gate.outputs.ready == 'true' && needs.meta.outputs.is_rc != 'true' && github.event.inputs.dry_run != 'true'
        env:
          V: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ needs.meta.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          TIP=$(git rev-parse origin/main)
          if [ "$TIP" != "$COMMIT" ]; then
            echo "::notice title=version bump skipped::main moved past the tagged commit (${TIP:0:10} vs ${COMMIT:0:10}) — bump it by hand if needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B main origin/main
          NEXT="${V%.*}.$(( ${V##*.} + 1 ))"
          python3 - <<PY
          import re, os
          v = "$NEXT"
          p='desktop/src-tauri/tauri.conf.json'; s=open(p).read()
          s=re.sub(r'"version": "[0-9.]+",', f'"version": "{v}",', s, count=1); open(p,'w').write(s)
          p='apple/project.yml'; s=open(p).read()
          s=re.sub(r'MARKETING_VERSION: "[0-9.]+"', f'MARKETING_VERSION: "{v}"', s); open(p,'w').write(s)
          p='apple/Haven.xcodeproj/project.pbxproj'
          if os.path.exists(p):   # xcodegen-generated, gitignored — normally absent in CI
              s=open(p).read()
              s=re.sub(r'MARKETING_VERSION = [0-9.]+;', f'MARKETING_VERSION = {v};', s); open(p,'w').write(s)
          print("main ->", v)
          PY
          git add -A && git commit -q -m "back to development: $NEXT (the $V train closes on approval)" && git push origin HEAD:main
          echo "::notice title=version bump::main is now $NEXT"
          echo "- 🔁 main moved to $NEXT (the $V train closes on approval)" >> "$GITHUB_STEP_SUMMARY"

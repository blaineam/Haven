<!doctype html>
<!-- Microsoft Store screenshot template. Rendered to a 1920x1080 PNG (no transparency).
     Reads ?img= (render filename), ?head= (headline), ?sub= (subtitle). Self-contained. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root{
    --violet:#7C3AED; --pink:#EC4899; --amber:#F59E0B;
    --brand:linear-gradient(135deg,var(--violet),var(--pink),var(--amber));
    --bg:#0b0b10; --text:#f5f5f7; --text2:rgba(245,245,247,.66);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:var(--bg);
    background-image:
      radial-gradient(45% 55% at 88% -10%, rgba(236,72,153,.26), transparent 60%),
      radial-gradient(42% 50% at -6% 6%, rgba(124,58,237,.28), transparent 60%),
      radial-gradient(44% 48% at 55% 120%, rgba(245,158,11,.14), transparent 60%);
    color:var(--text); position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .head{font-size:52px;font-weight:850;letter-spacing:-.02em;text-align:center;margin-bottom:6px}
  .head .g{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:24px;font-weight:600;color:var(--text2);text-align:center;margin-bottom:34px}
  .shot{height:760px;max-width:1680px;object-fit:contain;
    filter:drop-shadow(0 40px 80px rgba(0,0,0,.6))}
</style>
</head>
<body>
  <div class="head" id="head"></div>
  <div class="sub" id="sub"></div>
  <img class="shot" id="shot" alt="" />
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('shot').src = 'assets/renders/' + (q.get('img') || 'windows-feed.png');
    const head = q.get('head') || 'A private home for <span class="g">your people</span>';
    document.getElementById('head').innerHTML = head;
    document.getElementById('sub').textContent = q.get('sub') || 'End-to-end encrypted circles — now on Windows';
  </script>
</body>
</html>

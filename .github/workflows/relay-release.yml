name: relay-release

# Relay-ONLY release path. Cross-builds the headless `haven-relay` static binary for every
# Linux arch the installer knows about, plus macOS, and publishes them as release assets named
# exactly what `relay/install.sh` downloads: `haven-relay-<target>`. Also builds .deb packages.
#
# A full `v*` tag is handled by release.yml (relay + desktop + Flatpak in one Release). Use a
# `relay-v*` tag here when you want to ship JUST a new relay without rebuilding the desktop app.

on:
  push:
    tags: ["relay-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Derive + validate the version the same way release.yml's `meta` job does, so a relay-only
  # hotfix lands on the same version line as everything else. Without this the .deb comes out
  # as haven-relay_0.0.1 (the hardcoded Cargo.toml value) — older than every main release under
  # dpkg ordering, so `apt upgrade` would never move anyone onto the hotfix. See docs/RELEASING.md.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # Via env, not `${{ }}` interpolation — a tag name is attacker-controllable text and
        # must never be pasted into a shell.
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          asc="$(python3 - <<'PY'
          import re, pathlib, sys
          t = pathlib.Path("apple/project.yml").read_text()
          vs = set(re.findall(r'(?m)^\s*MARKETING_VERSION:\s*"([^"]+)"', t))
          if not vs:
              sys.exit("no MARKETING_VERSION found in apple/project.yml")
          if len(vs) > 1:
              sys.exit(f"apple/project.yml disagrees with itself: MARKETING_VERSION = {sorted(vs)}")
          print(vs.pop())
          PY
          )"

          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#relay-v}"
          else
            # workflow_dispatch dry-run off a branch: build what the next relay WOULD be,
            # instead of stamping the branch name ("main") in as a version.
            version="$asc"
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$REF_NAME' is not a plain relay-vX.Y.Z. Haven releases track the App" \
                 "Store marketing version — no -beta/-rc/-alpha suffixes. See docs/RELEASING.md."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "haven-relay **$version**" >> "$GITHUB_STEP_SUMMARY"

          # Not fatal: shipping a relay ahead of the App Store number is the whole point of this
          # path. But the versions are protocol-coupled, so drift is worth saying out loud.
          if [ "$version" != "$asc" ]; then
            echo "::warning::relay-v$version does not match apple/project.yml MARKETING_VERSION" \
                 "($asc). One product, one version — fold this into a v$version release when you" \
                 "next ship the apps. See docs/RELEASING.md."
          fi

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            deb: true
          - target: aarch64-unknown-linux-musl   # 64-bit Raspberry Pi OS / Arm servers
            deb: true
          - target: armv7-unknown-linux-musleabihf # 32-bit Raspbian, Pi 2/3/4
            deb: true
          - target: arm-unknown-linux-musleabihf   # Pi Zero / Pi 1
            deb: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Stamp version
        run: |
          python3 - <<'PY'
          import re, pathlib
          v = "${{ needs.meta.outputs.version }}"
          p = pathlib.Path("core/haven-relay/Cargo.toml")
          t = p.read_text()
          t = re.sub(r'(?m)^version = ".*"', f'version = "{v}"', t, count=1)
          p.write_text(t)
          PY

      # zig gives painless musl + Arm cross-compilation from a single x86_64 runner.
      - name: Install zig
        run: |
          ZIG_VER=0.13.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig && tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild + cargo-deb
        run: cargo install cargo-zigbuild cargo-deb --locked

      - name: Build haven-relay (${{ matrix.target }})
        working-directory: core
        run: cargo zigbuild --release -p haven-relay --target ${{ matrix.target }}

      - name: Stage binary as haven-relay-<target>
        run: |
          mkdir -p dist
          cp "core/target/${{ matrix.target }}/release/haven-relay" \
             "dist/haven-relay-${{ matrix.target }}"

      - name: Build .deb (${{ matrix.target }})
        if: matrix.deb
        continue-on-error: true   # host strip can't strip cross arm binaries; never block the binary
        working-directory: core
        run: |
          cargo deb -p haven-relay --no-build --no-strip --target ${{ matrix.target }} --output ../dist/
        # --no-build reuses the zigbuild artifact above; cargo-deb maps the .deb arch
        # (amd64/arm64/armhf) from the target triple automatically.

      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: meta
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Stamp version
        run: |
          python3 - <<'PY'
          import re, pathlib
          v = "${{ needs.meta.outputs.version }}"
          p = pathlib.Path("core/haven-relay/Cargo.toml")
          t = p.read_text()
          t = re.sub(r'(?m)^version = ".*"', f'version = "{v}"', t, count=1)
          p.write_text(t)
          PY
      - name: Build haven-relay (${{ matrix.target }})
        working-directory: core
        run: cargo build --release -p haven-relay --target ${{ matrix.target }}
      - name: Stage binary
        run: |
          mkdir -p dist
          cp "core/target/${{ matrix.target }}/release/haven-relay" \
             "dist/haven-relay-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Stamp version
        shell: bash
        run: |
          python -c "import re,pathlib; p=pathlib.Path('core/haven-relay/Cargo.toml'); t=p.read_text(); p.write_text(re.sub(r'(?m)^version = \".*\"','version = \"${{ needs.meta.outputs.version }}\"',t,count=1))"
      - name: Build haven-relay (${{ matrix.target }})
        working-directory: core
        run: cargo build --release -p haven-relay --target ${{ matrix.target }}
      - name: Stage binary as haven-relay-<target>.exe
        shell: bash
        run: |
          mkdir -p dist
          cp "core/target/${{ matrix.target }}/release/haven-relay.exe" \
             "dist/haven-relay-${{ matrix.target }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

name: desktop

# Build the Tauri desktop client for Windows + Linux. Produces installers as artifacts:
# Windows .msi + NSIS .exe (wrap into MSIX for the Microsoft Store — see docs/WINDOWS-PORT.md),
# Linux .deb + .AppImage. macOS is built by the Apple pipeline, not here.

on:
  push:
    branches: [main, windows-desktop]
    paths:
      - "desktop/**"
      - "core/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            desktop/src-tauri
      # Tauri externalBin requires binaries/cloudflared-<triple> to exist at build-script time
      # (even for `cargo test --lib`). Same pin as release.yml — tools/fetch-cloudflared.sh.
      - name: Fetch cloudflared for this runner
        run: tools/fetch-cloudflared.sh --force
      - name: Unit tests (core + client layer + desktop)
        run: |
          # haven-p2p is the crypto core (identity, groupkey, device roster, treekem) and its
          # 180 tests — including the wire-parser fuzz harness — ran nowhere in CI until this
          # was added: only haven-s3 and the desktop lib were covered. ~50s, and it is the one
          # crate where a silent regression is a security regression, so it runs first.
          cargo test -p haven-p2p --manifest-path core/Cargo.toml
          cargo test -p haven-s3 --manifest-path core/Cargo.toml
          # System webkit deps so the desktop lib's tauri build deps resolve.
          sudo apt-get update
          # nasm: rav1e (the AVIF preview encoder) builds assembly and fails without it.
          sudo apt-get install -y nasm libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          # The client layer (engine, stores, wire) — it was the bulk of the desktop lib's tests
          # until it moved to core/haven-client so the browser build could link it.
          cargo test -p haven-client --manifest-path core/Cargo.toml
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib

  # The web client archive (see web-client.yml). Never fails here.
  web-client:
    uses: ./.github/workflows/web-client.yml
    with:
      packaging_only: true

  build:
    needs: [test-core, web-client]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file nasm
          # nasm: rav1e (AVIF preview encoder) assembles with it. THIRD time this bit: this
          # workflow has TWO jobs with TWO separate deps lists (test-core got nasm first),
          # and release.yml carries its own third list. Grep them ALL when adding a dep.

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # externalBin: binaries/cloudflared — not committed; must fetch before `cargo tauri build`.
      - name: Fetch cloudflared for this runner
        shell: bash
        run: tools/fetch-cloudflared.sh --force

      # The web client, for the relay this app can host (Settings ▸ Relays ▸ Web access). Optional:
      # if the archive was not built, the app is complete and simply has no such switch.
      - name: Fetch the web client
        id: webclient
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: web-client
          path: web-client-archive
      - name: Unpack the web client into the app's resources
        if: steps.webclient.outcome == 'success'
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/web-client
          tar -C desktop/src-tauri/web-client -xzf web-client-archive/haven-web-client.tar.gz
          rm -rf web-client-archive
          test -f desktop/src-tauri/web-client/index.html

      - name: Build (GUI + headless relay)
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          if [ -f web-client/index.html ]; then
            cargo tauri build --config '{"bundle":{"resources":["web-client/**/*"]}}'
          else
            cargo tauri build
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: haven-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
          retention-days: 3

  # SteamOS / Steam Deck (and any Flatpak distro). Builds the Flatpak from the .deb the
  # Linux build job just produced, so the artifact matches what users sideload via Discover.
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Linux build (.deb)
        uses: actions/download-artifact@v4
        with:
          name: haven-linux
          path: linux-build
      - name: Point the manifest at the local .deb
        run: |
          deb=$(find linux-build -name '*.deb' | head -n1)
          cp "$deb" desktop/flatpak/haven.deb
          python3 - <<'PY'
          import re, pathlib
          m = pathlib.Path("desktop/flatpak/com.blaineam.haven.yml")
          t = m.read_text()
          # Replace the remote .deb source (url+sha+dest-filename) with a local file source.
          t = re.sub(
              r"      - type: file\n        # CI uploads.*?\n        url:.*?\n        sha256:.*?\n        dest-filename: haven\.deb",
              "      - type: file\n        path: haven.deb",
              t, flags=re.S)
          m.write_text(t)
          PY
      # The image ships its runtimes in a lower overlayfs layer. When Flathub has a newer point
      # release than the image, flatpak-builder updates the runtime by renaming directories that
      # live in that lower layer, which overlayfs refuses with EXDEV ("Invalid cross-device link"),
      # and the build dies (v2.1.3 once, v2.2.2 on every attempt). Copying the installation up
      # into the writable layer first makes those renames ordinary.
      - name: Make the image's Flatpak installation updatable
        run: |
          set -euo pipefail
          df -h /var/lib | tail -1
          cp -a /var/lib/flatpak /var/lib/flatpak.up
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.up /var/lib/flatpak
          df -h /var/lib | tail -1
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: haven.flatpak
          manifest-path: desktop/flatpak/com.blaineam.haven.yml
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: haven-steamos-flatpak
          path: haven.flatpak
          if-no-files-found: ignore
          retention-days: 3

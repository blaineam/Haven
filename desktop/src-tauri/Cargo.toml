# Haven for Windows (and Linux) — a Tauri 2 desktop client.
#
# The backend links the SAME Rust core the iPhone and Android apps use (`haven_ffi`,
# which re-exports `p2pcore` + `haven-net`) DIRECTLY as a Rust crate — no UniFFI hop,
# because this process is itself Rust. The WebView2 frontend (ui/) is the GUI; the same
# binary runs headless as the circle relay/mailbox with `--headless`.
[package]
name = "haven-desktop"
version = "0.1.0"
description = "Haven — private, post-quantum, peer-to-peer social. Desktop client + relay."
authors = ["Blaine Miller"]
edition = "2021"
rust-version = "1.77"

# Detach from any parent workspace; build as our own root.
[workspace]

[lib]
name = "haven_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "haven-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Non-poisoning mutexes. See the StdMutex alias in engine.rs for why.
parking_lot = "0.12"
# The shared engine (identity, circles, feed, sealing, iroh node, relay/mailbox).
haven_ffi = { path = "../../core/haven-ffi" }
# The 512px AVIF preview tier (docs/PREVIEW-TIER-DESIGN.md). Desktop encodes images in the WEBVIEW
# today (canvas.toDataURL), and Chromium's canvas has no AVIF writer — so the preview encode lives
# in Rust instead. ravif is rav1e-backed, royalty-free (no HEVC packaging problem on Windows/Linux),
# and encodes 512px in tens of milliseconds.
# asm OFF (pure-Rust rav1e) on every target: the assembly cannot assemble under the MSVC
# arm64 cross toolchain (LNK1181 on the NEON .o files — silently killed every arm64 MSIX
# after 1.5.0's), and keeping one codepath everywhere beats a few dozen ms on a 512px
# preview encode. Also frees CI from the nasm dependency.
ravif = { version = "0.11", default-features = false, features = ["threading"] }
rgb = "0.8"
# Decoding only, for the preview tier: the composer hands us sanitized JPEG/PNG from the webview and
# we re-encode it as AVIF, which the webview cannot do. Default features off — no need to carry every
# format's decoder for this.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# The pure core crate — used DIRECTLY for the multi-device self-sync CRDT (AccountState,
# Stamp, slot_key/slot_prefix) and identity self-sync key, matching the iOS wire format.
haven-p2p = { path = "../../core/haven-p2p" }
# Shared BYO-storage mailbox (SigV4 S3 client) — additive core crate.
haven-s3 = { path = "../../core/haven-s3" }
# The relay's own crate — for `httprelay::auth_header`, so the desktop client signs its plain-HTTP
# media requests with byte-identical code to the one the relay verifies with.
haven-net = { path = "../../core/haven-net" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Start Haven on login (registry / LaunchAgent / .desktop) so the in-app relay survives reboot.
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

# Key storage: OS-native secure store (Windows Credential Manager / macOS Keychain /
# Linux Secret Service) — keys never leave the device, same rule as iOS/Android.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Random-access ZIP reader for the Instagram archive importer (`instagram.rs`). Deliberately a
# crate rather than hand-rolled: the export is a 1.28 GB zip whose central directory must be seeked,
# not streamed, and a half-correct local-header parser is exactly the kind of thing that silently
# drops entries. `deflate-flate2` only — flate2 is already in the tree (via tauri), and we never
# WRITE a zip, so zopfli's compressor would be dead weight.
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
sha2 = "0.10"
# Client for relays' plain-HTTP media interfaces (the default cross-NAT media transport) — same
# version/features as haven-s3, so it's already in the dependency tree.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# HKDF for the own-device media key (HKDF-SHA256 over the account seed) — symmetric-seal own-device
# media chunks so a sibling can open them (KEM-to-self doesn't decap reliably). Matches iOS.
hkdf = "0.12"
rand = "0.8"
hex = "0.4"
data-encoding = "2"
dirs = "5"
base64 = "0.22"
log = "0.4"

# Free-space query for the re-optimize headroom guard (see reoptimize::free_space_bytes). Both are
# already in the dependency tree via tauri, so this costs no extra compilation — and it is a far
# smaller thing to depend on than the alternative of shelling out or of vendoring a disk-usage crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[features]
# Default to a custom binary protocol for the heavier media payloads later.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The DEBUG binary is what the e2e fleet drives, and it is the only leg of that fleet running the
# Rust core unoptimized: Android links `libhaven_ffi.so` from `cargo ndk … --release`
# (android/build-rust.sh) and the Apple apps link the release XCFramework. Unoptimized, one
# `receive()` of a key/tree commit — ML-KEM decapsulations and ML-DSA verifies per member — held the
# engine lock 17–49 s on the e2e desktop leg, which is where "desktop converges on a materially
# longer cycle than the mobile legs" (a 6× budget multiplier in the harness) actually came from.
# Optimize the core and its crypto in the dev profile; the desktop crate itself stays unoptimized
# (fast incremental builds, full debug info). These only recompile when they change.
[profile.dev.package.haven-p2p]
opt-level = 3
[profile.dev.package.haven_ffi]
opt-level = 3
[profile.dev.package.haven-net]
opt-level = 3
[profile.dev.package.ml-kem]
opt-level = 3
[profile.dev.package.ml-dsa]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

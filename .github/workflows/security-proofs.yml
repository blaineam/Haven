name: security-proofs

# Keeps Haven's security argument from rotting.
#
# Re-proves every Tamarin model in docs/formal and fails if any lemma's result differs from
# docs/formal/EXPECTED.txt (a proof that stops verifying, or a documented limit that silently
# "starts" verifying, both fail).
#
# Runs only when a model, the expected results or the proof script changes, because the result
# depends on nothing else. Run it by hand (workflow_dispatch) to re-check after a prover
# upgrade. The tests that tie the code to the models are in core-security-tests.yml.
#
# What this does and does not show is written down in docs/formal/PROTOCOL-SPEC.md: the proofs
# are symbolic (Dolev-Yao) proofs about the models. They are not a computational proof or an
# external audit.

on:
  push:
    branches: [main]
    paths:
      - "docs/formal/**"
      - ".github/workflows/security-proofs.yml"
  pull_request:
    paths:
      - "docs/formal/**"
      - ".github/workflows/security-proofs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    name: Tamarin models
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Tamarin
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install tamarin-prover/tap/tamarin-prover
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          tamarin-prover --version
      - name: Prove every lemma and compare with EXPECTED.txt
        env:
          TAMARIN_RTS: "-N4 -M13G"
          LEMMA_TIMEOUT: "1200"
        run: docs/formal/verify.sh

name: apple-tests

# The Apple LOGIC tests, on every push and PR that touches them.
#
# Why this exists: until now `xcodebuild test` appeared in NO workflow, so HavenLogicTests and
# HavenUITests never ran automatically. That is not a theoretical gap — it let the HavenLogicTests
# TARGET stop compiling entirely (CallHairpin grew a FeedStore dependency, breaking the target's
# host-less promise) and nobody found out until someone tried to add a test months later. In the
# meantime a test written specifically to keep call traffic off Google STUN sat inert while the ICE
# policy changed past it. A guard nothing runs is not a guard.
#
# Deliberately the LOGIC suite only:
#   * it is host-LESS and FFI-less by design — VERIFIED by running it with HavenFFI.xcframework
#     physically absent: 61 tests, 0 failures, 2.5s. So this job needs no Rust cross-compile, no
#     simulator, no signing, and no secrets.
#   * HavenUITests are deliberately NOT here. They need a SIGNED simulator build (an unsigned one has
#     no keychain entitlement, so there is no engine to drive) and minutes per run. Those are driven
#     by hand through Soren instead.
on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/apple-tests.yml"
  pull_request:
    paths:
      - "apple/**"
      - ".github/workflows/apple-tests.yml"
  workflow_dispatch:

concurrency:
  group: apple-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The .xcodeproj is generated, not committed — same as every other Apple build path.
      - name: Install xcodegen
        run: brew install xcodegen

      # xcodegen validates EVERY target in the spec, not just the one we intend to build, and
      # Haven/HavenMac/HavenNotificationService list `Generated/haven_ffi.swift` — the UniFFI
      # bindings, which are gitignored and produced by build-rust-xcframework.sh. Without a file
      # there, generation fails outright and this job can never reach the tests.
      #
      # A placeholder is enough: it satisfies spec validation and is NEVER COMPILED here, because
      # HavenLogicTests lists its sources explicitly and none of them are under Generated/. Building
      # the real bindings would mean a full Rust cross-compile — the whole point of this job is that
      # it does not need one (verified: the suite passes with HavenFFI.xcframework absent).
      - name: Placeholder for the generated FFI bindings (never compiled by this target)
        working-directory: apple
        run: |
          mkdir -p Generated
          [ -f Generated/haven_ffi.swift ] || \
            echo "// Placeholder for xcodegen spec validation — see .github/workflows/apple-tests.yml" \
              > Generated/haven_ffi.swift

      # MillerKit resolves from the PRIVATE github.com/blaineam/MillerKit, which this runner's
      # GITHUB_TOKEN cannot clone — and just like the FFI bindings above, the logic suite never
      # compiles a line of it (HavenLogicTests lists its sources explicitly; none import MillerKit).
      # So: point the spec at an empty local stub package for this job only. SPM resolution
      # succeeds offline, and nothing that links the real MillerKit is ever built here.
      - name: Stub the private MillerKit package (never compiled by this target)
        working-directory: apple
        run: |
          STUB="$RUNNER_TEMP/MillerKitStub"
          mkdir -p "$STUB/Sources/MillerKit"
          printf '%s\n' \
            '// swift-tools-version:5.9' \
            'import PackageDescription' \
            'let package = Package(' \
            '    name: "MillerKit",' \
            '    platforms: [.iOS(.v17), .macOS(.v14), .watchOS(.v10)],' \
            '    products: [.library(name: "MillerKit", targets: ["MillerKit"])],' \
            '    targets: [.target(name: "MillerKit")])' \
            > "$STUB/Package.swift"
          echo "// stub — see .github/workflows/apple-tests.yml" > "$STUB/Sources/MillerKit/Stub.swift"
          /usr/bin/sed -i '' \
            -e "s#url: https://github.com/blaineam/MillerKit#path: $STUB#" \
            -e '/^    from: "1\.0\.0"$/d' \
            project.yml
          grep -n -A2 'MillerKit:' project.yml | head -4

      - name: Generate the project
        working-directory: apple
        run: xcodegen generate --project .

      # No -derivedDataPath override: the default keeps the run self-contained. CODE_SIGNING_ALLOWED
      # =NO is safe HERE (and only here) because the logic bundle links no entitlement-bearing code —
      # the UI tests are the ones that genuinely need signing.
      - name: Run HavenLogicTests
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild test \
            -project Haven.xcodeproj \
            -scheme HavenLogicTests \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/logic-tests.log
      - name: Summarise
        if: always()
        run: grep -E "Executed .* tests?" /tmp/logic-tests.log | tail -2 >> "$GITHUB_STEP_SUMMARY" || true
